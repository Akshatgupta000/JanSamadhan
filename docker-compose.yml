version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: jansamadhan-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: jansamadhan
      POSTGRES_PASSWORD: jansamadhan_secret
      POSTGRES_DB: jansamadhan_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jansamadhan -d jansamadhan_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: jansamadhan-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-09-22T00-33-43Z
    container_name: jansamadhan-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jansamadhan-api
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://jansamadhan:jansamadhan_secret@postgres:5432/jansamadhan_db?schema=public
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: dev_jwt_access_secret_min_32_characters_random_string_here
      JWT_ACCESS_EXPIRATION: 15m
      JWT_REFRESH_SECRET: dev_jwt_refresh_secret_min_32_characters_random_string_here
      JWT_REFRESH_EXPIRATION: 7d
      STORAGE_PROVIDER: s3
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: jansamadhan-evidence
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_FORCE_PATH_STYLE: "true"
      AI_PROVIDER: mock
      EMBEDDING_PROVIDER: mock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  minio_data:

